services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: omnisell
      POSTGRES_USER: omnisell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnisell -d omnisell"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [omnisell-net]

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [omnisell-net]

  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: [.env]
    command: ["/bin/sh", "-c", "alembic upgrade head && python scripts/configure_postgres_app_role.py"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [omnisell-net]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: [.env]
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers"]
    ports: ["8080:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/admin/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [omnisell-net]

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: [.env]
    command: ["celery", "-A", "application.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=text,vision,sync,operations", "--concurrency=4"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [omnisell-net]

  scheduler:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: [.env]
    command: ["celery", "-A", "application.celery_app:celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [omnisell-net]

volumes:
  postgres-data:
  redis-data:

networks:
  omnisell-net:
    driver: bridge
