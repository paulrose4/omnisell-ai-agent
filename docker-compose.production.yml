services:
  migrate:
    env_file: [.env.production]

  api:
    env_file: [.env.production]
    ports: !reset []
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4318
  worker:
    env_file: [.env.production]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4318
  scheduler:
    env_file: [.env.production]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4318

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ENVIRONMENT: "production"
        NEXT_PUBLIC_MOCK_DRILL_ENABLED: "false"
        NEXT_PUBLIC_SELLER_CENTRAL_URL: https://sellercentral.amazon.com
        NEXT_PUBLIC_REFRESH_INTERVAL_MS: "5000"
    env_file: [./frontend/.env.production]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [omnisell-net]

  caddy:
    image: caddy:2.10.0-alpine
    env_file: [.env.production]
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [frontend, api]
    restart: unless-stopped
    networks: [omnisell-net]

  observability:
    image: grafana/otel-lgtm:0.11.9
    volumes:
      - observability-data:/data
    restart: unless-stopped
    networks: [omnisell-net]

volumes:
  caddy-data:
  caddy-config:
  observability-data:
